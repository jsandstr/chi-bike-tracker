id: 25-mph-speed-limit
name: 25 mph default speed limit
kind: ordinance
jurisdiction: City of Chicago
status: failed
start: "2024-10"
end: "2025-02"
summary: >
  A proposal to lower Chicago's default speed limit from 30 to 25 mph. It
  passed the Committee on Pedestrian and Traffic Safety in October 2024, but
  the full City Council rejected it 21-28 on February 19, 2025, with
  opponents citing the burden of fines on Black, Latino and low-income
  residents.
measure: false
