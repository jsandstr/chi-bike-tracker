    url: https://www.roadsbridges.com/transportation-management/news/10654329/chicago-dot-announces-largest-bike-lane-expansion-in-citys-history
  - title: CDOT announces major bikeway push (Streetsblog Chicago)
    url: https://chi.streetsblog.org/2021/09/22/cdot-announces-major-bikeway-push-still-no-plans-for-a-cohesive-protected-network/
