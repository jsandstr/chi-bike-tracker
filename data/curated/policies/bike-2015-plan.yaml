id: bike-2015-plan
name: Bike 2015 Plan
kind: plan
jurisdiction: City of Chicago
status: expired
start: "2006-06"
end: "2015-12"
summary: >
  Adopted in 2006 under Mayor Daley. It proposed a 500-mile bikeway network
  with a bikeway within half a mile of every resident, and set two headline
  goals: 5% of all trips under five miles made by bike, and bicycle injuries
  cut in half. Most of its period predates the city's archived bike route
  data, so no coverage contribution is calculated.
measure: false
