[project]
name = "pipeline"
version = "0.1.0"
description = "Data pipeline for the Chicago bike infrastructure tracker"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=1.11.0",
    "geopandas>=1.2.0",
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
    "pyproj>=3.8.0",
    "pyyaml>=6.0.3",
    "shapely>=2.1.2",
]

[project.scripts]
pipeline = "pipeline.cli:main"

[tool.ruff]
line-length = 100

[build-system]
requires = ["uv_build>=0.8.0,<0.9"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
